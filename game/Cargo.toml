[package]
name = "gate_quest"
version = "0.1.0"
publish = false
authors = ["Ryan Schaffer <codeallergy@gmail.com>"]
edition = "2024"
exclude = ["build", "assets"]

[dependencies]
sim_core = { path = "../crates/sim_core" }


bevy = { version = "0.15.3", features = ["dynamic_linking"] }
bevy_egui = "0.33.0"
catppuccin-egui = { version = "5.5.0", default-features = false, features = ["egui31"] }
bevy_mod_debugdump = "0.12.1"
bevy-inspector-egui = "0.30.0"

serde = { version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"

[build-dependencies]
embed-resource = "1"


# Blake3 pure on windows, for cross compilation
[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
