[package]
name = "logi-game"
version = "0.1.0"
edition = "2024"

[dependencies]
sim_core = { path = "../crates/sim_core" }


bevy = { version = "0.15.3" }
bevy_egui = "0.33.0"
catppuccin-egui = { version = "5.5.0", default-features = false, features = ["egui31"] }
bevy_mod_debugdump = "0.12.1"

serde = { version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"

[dev-dependencies]
wasm-bindgen-cli = "0.2.100"

# Blake3 pure on windows, for cross compilation
[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
