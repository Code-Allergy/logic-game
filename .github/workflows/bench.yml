name: Benchmarks

# Benchmarks build all of Bevy with LTO and take a long time, so they run only
# on main and by hand (Actions tab → Benchmarks → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override `-C target-cpu=native` from .cargo/config.toml: the cached target/
  # may come from a runner with a different CPU (SIGILL in build scripts).
  RUSTFLAGS: ""

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-bench-${{ hashFiles('**/Cargo.toml') }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install alsa and udev
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev
      - name: Run benchmarks
        run: cargo bench --all-targets --all-features --workspace