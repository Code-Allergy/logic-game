name: deploy-github-page

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned web build tools (bump deliberately, not via `latest`).
  TRUNK_VERSION: v0.22.2
  BINARYEN_VERSION: version_123

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install pkg-config libx11-dev libasound2-dev libudev-dev
      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: ${{ env.TRUNK_VERSION }}
      - name: Add wasm target
        run: |
          rustup target add wasm32-unknown-unknown
      - name: Build Release
        run: |
          trunk build --release
      - name: Install wasm-opt
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Optimize Wasm
        # The features rustc enables by default for wasm32-unknown-unknown.
        run: |
          for f in dist/*.wasm; do
            wasm-opt -Os --enable-bulk-memory --enable-nontrapping-float-to-int \
              --enable-sign-ext --enable-mutable-globals --enable-reference-types \
              --enable-multivalue "$f" -o "$f"
          done
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: gh-pages
          folder: dist