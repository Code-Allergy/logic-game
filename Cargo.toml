[package]
name = "gate_quest"
version = "0.1.0"
publish = false
authors = ["Ryan Schaffer <codeallergy@gmail.com>"]
edition = "2024"
exclude = ["build", "assets"]

[lib]
name = "gate_quest"

[features]
default = []
# Native development: Bevy as a dynamic library (faster incremental links)
# plus the world inspector. Not for release or wasm builds.
dev = ["bevy/dynamic_linking", "inspector"]
# The egui world inspector window.
inspector = ["dep:bevy-inspector-egui"]

[dependencies]
logi-sim = { path = "logi-sim" }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
smallvec = "1"

# egui
bevy = { version = "0.20", features = ["wayland"] }
bevy_egui = "0.43"
bevy-inspector-egui = { version = "0.38", optional = true }

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[build-dependencies]
embed-resource = "1"


# Blake3 pure on windows, for cross compilation
[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
[workspace]
resolver = "3"
members = ["logi-sim", "mobile"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.logi-sim]
opt-level = 3
debug = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The simulator is the hot path; "s" measured ~1.65x slower (on the old Flat runner).
[profile.release.package.logi-sim]
opt-level = 3

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true


[profile.bench]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = true

# Optimized native code with symbols retained for perf/cargo-flamegraph.
[profile.flamegraph]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 8
debug = true
strip = false

[profile.flamegraph-noinline]
inherits = "flamegraph"
debug = true
lto = false
codegen-units = 16
