[package]
name = "gate_quest"
version = "0.1.0"
publish = false
authors = ["Ryan Schaffer <codeallergy@gmail.com>"]
edition = "2024"
exclude = ["build", "assets"]
default-run = "gate_quest"

[lib]
name = "gate_quest"

# The MCP server on stdio, with no window (docs/mcp-server.md).
[[bin]]
name = "gatequest-mcp"
path = "src/bin/gatequest-mcp.rs"
required-features = ["mcp"]

[features]
default = []
# Native development: Bevy as a dynamic library (faster incremental links)
# plus the world inspector. Not for release or wasm builds.
dev = ["bevy/dynamic_linking", "inspector"]
# The egui world inspector window.
# (Registering every reflected type is only of use to the inspector.)
inspector = ["dep:bevy-inspector-egui", "bevy/reflect_auto_register"]
# The MCP server: an AI assistant builds and inspects circuits
# (docs/mcp-server.md). Native only.
mcp = ["dep:rmcp", "dep:tokio", "dep:axum"]

[dependencies]
logi-sim = { path = "logi-sim" }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
smallvec = "1"

# egui
# Only what a 2D game with a bevy_ui title menu and an egui HUD uses: no
# 3D/PBR, glTF, audio, animation, scenes, gamepads (gilrs) or image
# formats (the game loads no image files). `webgl2` is the wasm backend.
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_state",
    "bevy_asset",
    "bevy_winit",
    "x11",
    "wayland",
    "webgl2",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite_render",
    "bevy_gizmos_render",
    "bevy_text",
    "default_font",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_input_focus",
    "ui_picking",
] }
bevy_egui = "0.43"
bevy-inspector-egui = { version = "0.38", optional = true, default-features = false, features = ["2d", "documentation", "egui_clipboard"] }

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# The MCP server (feature `mcp`).
# (`client` is for the tests, which drive the server through the protocol.)
rmcp = { version = "3.11", optional = true, features = [
    "server",
    "client",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1", optional = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "net",
] }
# The HTTP endpoint of the running game (`--mcp`).
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }

[build-dependencies]
embed-resource = "3"


# Blake3 pure on windows, for cross compilation
[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
[workspace]
resolver = "3"
members = ["logi-sim", "mobile", "perf", "perf/metrics", "xtask"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.logi-sim]
opt-level = 3
debug = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The simulator is the hot path; "s" measured ~1.65x slower (on the old Flat runner).
[profile.release.package.logi-sim]
opt-level = 3

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true


[profile.bench]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = true

# `cargo xtask perf` (bench and flamegraph): optimized like release but
# without LTO and with many codegen units, so the benchmark crates that
# link Bevy build in reasonable time and memory, and with line tables
# for profiles. The simulator keeps one codegen unit.
[profile.profiling]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
debug = "line-tables-only"
strip = false

[profile.profiling.package.logi-sim]
opt-level = 3
codegen-units = 1

# Optimized native code with symbols retained for perf/cargo-flamegraph.
[profile.flamegraph]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 8
debug = true
strip = false

[profile.flamegraph-noinline]
inherits = "flamegraph"
debug = true
lto = false
codegen-units = 16
