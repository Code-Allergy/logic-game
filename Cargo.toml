[package]
name = "gate_quest"
version = "0.1.0"
publish = false
authors = ["Ryan Schaffer <codeallergy@gmail.com>"]
edition = "2024"
exclude = ["build", "assets"]

[lib]
name = "gate_quest"

[dependencies]
sim_core = { path = "crates/sim_core" }
bevy = { version = "0.16.0", features = ["dynamic_linking"] }
bevy_egui = "0.34.1"
catppuccin-egui = { version = "5.5.0", default-features = false, features = [
    "egui31",
] }
bevy_mod_debugdump = "0.13"
bevy-inspector-egui = "0.31"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
embed-resource = "1"


# Blake3 pure on windows, for cross compilation
[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
[workspace]
resolver = "3"
members = ["crates/sim_core", "mobile"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true


[profile.bench]
debug = true
