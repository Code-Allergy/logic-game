[package]
name = "gate_quest"
version = "0.1.0"
publish = false
authors = ["Ryan Schaffer <codeallergy@gmail.com>"]
edition = "2024"
exclude = ["build", "assets"]

[lib]
name = "gate_quest"

[dependencies]
sim_core = { path = "crates/sim_core" }

# egui
bevy = { version = "0.19.0", features = ["dynamic_linking", "wayland"] }
bevy_egui = "0.40"
bevy_mod_debugdump = "0.16"
bevy-inspector-egui = "0.37"

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

[build-dependencies]
embed-resource = "1"


# Blake3 pure on windows, for cross compilation
[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
[workspace]
resolver = "3"
members = ["crates/sim_core", "logi-sim", "mobile"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true


[profile.bench]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = true
