[package]
name = "logi-sim"
version = "0.1.0"
edition = "2024"


[features]
# Deterministic work counters on `Sim` (`Sim::counters`), for the
# regression gate (`cargo xtask perf check`). Off by default; without it
# the runtime has no counting code at all.
counters = []

[dependencies]
foldhash = "0.2"
slotmap = "1.1.1"
smallvec = "1.15.2"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "sim"
harness = false

[[bench]]
name = "engine"
harness = false
